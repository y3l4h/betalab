<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>BetaLab</title>
  <meta name="description" content="Bouldering log: workout plans, climb photos, rest timer.">
  <meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f6f5f2" media="(prefers-color-scheme: light)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="BetaLab">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="main"></main>

  <div id="timer" class="timer" hidden>
    <div class="timer-fill"><div id="timer-fill"></div></div>
    <div class="timer-row">
      <button id="timer-minus" class="timer-btn" aria-label="Remove 15 seconds">−15</button>
      <div class="timer-center">
        <div id="timer-label" class="timer-label">Rest</div>
        <div id="timer-time" class="timer-time">0:00</div>
      </div>
      <button id="timer-plus" class="timer-btn" aria-label="Add 15 seconds">+15</button>
      <button id="timer-close" class="timer-btn close" aria-label="Stop timer">✕</button>
    </div>
  </div>

  <nav class="tabbar">
    <button data-tab="train">
      <svg viewBox="0 0 24 24"><path d="M6.5 6.5v11M17.5 6.5v11M3 9.5v5M21 9.5v5M6.5 12h11"/></svg>
      <span>Train</span>
    </button>
    <button data-tab="climbs">
      <svg viewBox="0 0 24 24"><path d="M4 20l5-9 3 5 3-4 5 8z"/><circle cx="17" cy="6" r="2"/></svg>
      <span>Climbs</span>
    </button>

    <button data-tab="progress">
      <svg viewBox="0 0 24 24"><path d="M4 20h16M7 16v-4M12 16V7M17 16v-7"/></svg>
      <span>Progress</span>
    </button>
    <button data-tab="settings">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M4.2 6.2l2.1 2.1M17.7 15.7l2.1 2.1M2.5 12h3M18.5 12h3M4.2 17.8l2.1-2.1M17.7 8.3l2.1-2.1"/></svg>
      <span>Settings</span>
    </button>
  </nav>

  <div id="toast" class="toast" hidden></div>
  <script type="module" src="app.js"></script>
</body>
</html>
